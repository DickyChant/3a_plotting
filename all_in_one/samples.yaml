# Sample definitions for RDatasetSpec
# Each sample includes:
#   - files: list of file paths or patterns
#   - is_mc: whether this is Monte Carlo (true) or data (false)
#   - is_unweighted: whether the sample is unweighted (for certain MC types)
#   - cross_section: cross section in pb (for MC samples)
#   - color: color code for plotting
#   - category: grouping category for stacked plots

# Luminosity per year (pb^-1)
luminosity:
  "2016pre": 19500
  "2016post": 16800
  "2017": 41480
  "2018": 59700

